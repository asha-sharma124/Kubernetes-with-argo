apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: piggymetrics
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/asha-sharma124/Kubernetes-with-argo.git
    targetRevision: main
    path: kubernetes-manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: piggymetricss
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
  revisionHistoryLimit: 10